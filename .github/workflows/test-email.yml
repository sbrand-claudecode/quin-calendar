name: Test Email (diagnostic)

# Diagnostic-only workflow for isolating Gmail SMTP auth from the main
# update-calendar workflow's dynamic content. Delete once the 535 5.7.8
# regression is diagnosed and fixed.

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect secret shape (no value leaked)
        env:
          PW: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL: ${{ secrets.QUIN_EMAIL }}
        run: |
          # Print only byte counts and whitespace markers, never the value.
          # Expected password length: 16 (no spaces) or 19 (with 3 spaces).
          # Anything else (17, 20, 21...) = stray whitespace/newline in the secret.
          printf '%s' "$PW" | wc -c | awk '{print "GMAIL_APP_PASSWORD byte length:", $1}'
          printf '%s' "$EMAIL" | wc -c | awk '{print "QUIN_EMAIL byte length:", $1}'
          # Check for trailing newline / CR specifically
          if printf '%s' "$PW" | tail -c 1 | od -An -c | grep -qE '\\n|\\r| '; then
            echo "WARNING: GMAIL_APP_PASSWORD ends with whitespace/newline"
          else
            echo "GMAIL_APP_PASSWORD: no trailing whitespace"
          fi

      - name: Send test email (via nodemailer, trims secret)
        env:
          GMAIL_USER: ${{ secrets.QUIN_EMAIL }}
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          npm install nodemailer --no-save
          node -e '
            const nodemailer = require("nodemailer");
            const user = (process.env.GMAIL_USER || "").trim();
            const pass = (process.env.GMAIL_PASS || "").replace(/\s+/g, "");
            console.log("cleaned password length:", pass.length);
            const t = nodemailer.createTransport({
              host: "smtp.gmail.com", port: 465, secure: true,
              auth: { user, pass },
            });
            t.sendMail({
              from: `Quin Calendar Monitor <${user}>`,
              to: user,
              subject: "[Quin] Test email — monitor path verification",
              text: "This is a test email from the quin-calendar diagnostic workflow.\nIf you received this, Gmail SMTP auth with GMAIL_APP_PASSWORD is working.",
            }).then(info => console.log("sent:", info.messageId))
              .catch(err => { console.error(err); process.exit(1); });
          '
