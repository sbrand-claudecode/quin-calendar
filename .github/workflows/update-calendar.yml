name: Update Quin House Calendar

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write

jobs:
  # Stay out of the Monday enrollment window. On 2026-10-05 a (late) calendar
  # run refreshed the shared Quin token at 8:52 ET and the enroll job that
  # started 11s later was handed the old, already-spent one. Skipping one
  # Monday-morning calendar update costs nothing (it runs every 6 hours).
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        run: |
          DOW=$(TZ=America/New_York date +%u)   # 1 = Monday
          HM=$(TZ=America/New_York date +%H%M)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$DOW" = "1" ] && [ "$HM" -ge 0800 ] && [ "$HM" -lt 1030 ]; then
            echo "Monday $HM ET is inside the enrollment window (08:00–10:30) — skipping this calendar run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Shares the single-use Quin refresh token with enroll-quin-events.yml —
    # the two must never spend it at the same time.
    concurrency:
      group: quin-auth
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        env:
          QUIN_EMAIL: ${{ secrets.QUIN_EMAIL }}
          QUIN_PASSWORD: ${{ secrets.QUIN_PASSWORD }}
          QUIN_REFRESH_TOKEN: ${{ secrets.QUIN_REFRESH_TOKEN }}
          REPO_SECRETS_PAT: ${{ secrets.REPO_SECRETS_PAT }}
          OUT_DIR: ./public
        run: node scrape.js

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_id }}
          path: |
            public/*.png
            public/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Check for availability transitions
        id: monitor
        run: |
          node monitor.js
          if [ -f email_body.txt ] && [ -f email_subject.txt ]; then
            echo "has_transitions=true" >> "$GITHUB_OUTPUT"
            {
              echo 'subject<<MONITOR_EOF'
              cat email_subject.txt
              echo 'MONITOR_EOF'
            } >> "$GITHUB_OUTPUT"
            {
              echo 'body<<MONITOR_EOF'
              cat email_body.txt
              echo 'MONITOR_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_transitions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification email
        if: steps.monitor.outputs.has_transitions == 'true'
        env:
          GMAIL_USER: ${{ secrets.QUIN_EMAIL }}
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_SUBJECT: ${{ steps.monitor.outputs.subject }}
          MAIL_BODY: ${{ steps.monitor.outputs.body }}
        run: |
          npm install nodemailer --no-save
          node -e '
            const nodemailer = require("nodemailer");
            const user = (process.env.GMAIL_USER || "").trim();
            const pass = (process.env.GMAIL_PASS || "").replace(/\s+/g, "");
            const t = nodemailer.createTransport({
              host: "smtp.gmail.com", port: 465, secure: true,
              auth: { user, pass },
            });
            t.sendMail({
              from: `Quin Calendar Monitor <${user}>`,
              to: user,
              subject: (process.env.MAIL_SUBJECT || "").trim(),
              text: process.env.MAIL_BODY || "",
            }).then(info => console.log("sent:", info.messageId))
              .catch(err => { console.error(err); process.exit(1); });
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Keep index.html between runs
          keep_files: true
