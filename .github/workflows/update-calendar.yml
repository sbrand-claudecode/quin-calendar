name: Update Quin House Calendar

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        env:
          QUIN_EMAIL: ${{ secrets.QUIN_EMAIL }}
          QUIN_PASSWORD: ${{ secrets.QUIN_PASSWORD }}
          OUT_DIR: ./public
        run: node scrape.js

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_id }}
          path: |
            public/*.png
            public/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Check for availability transitions
        id: monitor
        run: |
          node monitor.js
          if [ -f email_body.txt ] && [ -f email_subject.txt ]; then
            echo "has_transitions=true" >> "$GITHUB_OUTPUT"
            {
              echo 'subject<<MONITOR_EOF'
              cat email_subject.txt
              echo 'MONITOR_EOF'
            } >> "$GITHUB_OUTPUT"
            {
              echo 'body<<MONITOR_EOF'
              cat email_body.txt
              echo 'MONITOR_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_transitions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification email
        if: steps.monitor.outputs.has_transitions == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.QUIN_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.monitor.outputs.subject }}
          to: ${{ secrets.QUIN_EMAIL }}
          from: Quin Calendar Monitor <${{ secrets.QUIN_EMAIL }}>
          body: ${{ steps.monitor.outputs.body }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Keep index.html between runs
          keep_files: true
