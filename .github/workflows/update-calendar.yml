name: Update Quin House Calendar

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        env:
          QUIN_EMAIL: ${{ secrets.QUIN_EMAIL }}
          QUIN_PASSWORD: ${{ secrets.QUIN_PASSWORD }}
          QUIN_REFRESH_TOKEN: ${{ secrets.QUIN_REFRESH_TOKEN }}
          REPO_SECRETS_PAT: ${{ secrets.REPO_SECRETS_PAT }}
          OUT_DIR: ./public
        run: node scrape.js

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_id }}
          path: |
            public/*.png
            public/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Check for availability transitions
        id: monitor
        run: |
          node monitor.js
          if [ -f email_body.txt ] && [ -f email_subject.txt ]; then
            echo "has_transitions=true" >> "$GITHUB_OUTPUT"
            {
              echo 'subject<<MONITOR_EOF'
              cat email_subject.txt
              echo 'MONITOR_EOF'
            } >> "$GITHUB_OUTPUT"
            {
              echo 'body<<MONITOR_EOF'
              cat email_body.txt
              echo 'MONITOR_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_transitions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification email
        if: steps.monitor.outputs.has_transitions == 'true'
        env:
          GMAIL_USER: ${{ secrets.QUIN_EMAIL }}
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_SUBJECT: ${{ steps.monitor.outputs.subject }}
          MAIL_BODY: ${{ steps.monitor.outputs.body }}
        run: |
          npm install nodemailer --no-save
          node -e '
            const nodemailer = require("nodemailer");
            const user = (process.env.GMAIL_USER || "").trim();
            const pass = (process.env.GMAIL_PASS || "").replace(/\s+/g, "");
            const t = nodemailer.createTransport({
              host: "smtp.gmail.com", port: 465, secure: true,
              auth: { user, pass },
            });
            t.sendMail({
              from: `Quin Calendar Monitor <${user}>`,
              to: user,
              subject: (process.env.MAIL_SUBJECT || "").trim(),
              text: process.env.MAIL_BODY || "",
            }).then(info => console.log("sent:", info.messageId))
              .catch(err => { console.error(err); process.exit(1); });
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Keep index.html between runs
          keep_files: true
